<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate | Blockchain-Based Certificate Verification</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='certificate.css') }}">
</head>
<body>
    <header class="nav-shell">
        <a class="brand" href="/"><span class="brand-mark">BC</span> Blockchain-Based Certificate Verification</a>
        <nav class="nav-links"><a href="/upload_details">Register certificate</a></nav>
    </header>
    <main class="page-shell">
        <section class="page-intro">
            <span class="eyebrow">Authenticity check</span>
            <h2>Verify a certificate</h2>
            <p>Compare the certificate details with its blockchain-backed fingerprint and confirm whether it is authentic.</p>
        </section>
        <section class="workspace-card">
            <form id="file-upload-form" action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" id="file-upload" name="image" hidden accept=".jpg,.jpeg,.png">
                <label for="file-upload" class="drop-zone">
                    <span class="drop-icon">✓</span>
                    <strong>Choose certificate to verify</strong>
                    <span>PNG, JPG or JPEG · Click to browse</span>
                </label>
                <p id="selected-file" class="selected-file">No file selected</p>
                <div class="form-actions"><button id="submit-button" class="btn btn-primary" type="submit">Verify certificate</button></div>
            </form>
            <div id="progress-container" class="progress-wrap" hidden><div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div></div>
            <div id="response" class="response"></div>
        </section>
    </main>
    <script>
        const form = document.getElementById('file-upload-form');
        const fileInput = document.getElementById('file-upload');
        const selectedFile = document.getElementById('selected-file');
        const response = document.getElementById('response');
        const button = document.getElementById('submit-button');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        fileInput.addEventListener('change', () => {
            selectedFile.textContent = fileInput.files.length ? fileInput.files[0].name : 'No file selected';
            response.textContent = '';
        });
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!fileInput.files.length) { response.textContent = 'Please select a certificate image first.'; return; }
            button.disabled = true;
            response.textContent = 'Checking certificate authenticity...';
            progressContainer.hidden = false;
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) progressBar.style.width = `${(event.loaded / event.total) * 100}%`;
            };
            xhr.onload = () => {
                if (xhr.status === 200) window.location.href = '/result';
                else { response.textContent = xhr.responseText || 'Verification failed. Please try again.'; button.disabled = false; }
            };
            xhr.onerror = () => { response.textContent = 'The verification request failed. Please try again.'; button.disabled = false; };
            xhr.send(new FormData(form));
        });
    </script>
</body>
</html>
