<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Certificate | Blockchain-Based Certificate Verification</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='certificate.css') }}">
</head>
<body>
    <header class="nav-shell">
        <a class="brand" href="/"><span class="brand-mark">BC</span> Blockchain-Based Certificate Verification</a>
        <nav class="nav-links"><a href="/verify">Verify certificate</a></nav>
    </header>
    <main class="page-shell">
        <section class="page-intro">
            <span class="eyebrow">Certificate registration</span>
            <h2>Save a certificate securely</h2>
            <p>Upload a clear certificate image. We will extract its details and create a tamper-evident blockchain record.</p>
        </section>
        <section class="workspace-card">
            <form id="file-upload-form" action="/upload_data" method="POST" enctype="multipart/form-data">
                <input type="file" id="file-upload" name="image" hidden accept=".jpg,.jpeg,.png">
                <label for="file-upload" class="drop-zone">
                    <span class="drop-icon">⇧</span>
                    <strong>Choose certificate image</strong>
                    <span>PNG, JPG or JPEG · Click to browse</span>
                </label>
                <p id="selected-file" class="selected-file">No file selected</p>
                <div class="form-actions"><button id="submit-button" class="btn btn-primary" type="submit">Register certificate</button></div>
            </form>
            <div id="progress-container" class="progress-wrap" hidden><div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div></div>
            <div id="response" class="response"></div>
            <div id="transaction" class="selected-file"></div>
        </section>
    </main>
    <script>
        const form = document.getElementById('file-upload-form');
        const fileInput = document.getElementById('file-upload');
        const selectedFile = document.getElementById('selected-file');
        const response = document.getElementById('response');
        const button = document.getElementById('submit-button');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const transaction = document.getElementById('transaction');

        fileInput.addEventListener('change', () => {
            selectedFile.textContent = fileInput.files.length ? fileInput.files[0].name : 'No file selected';
            response.textContent = '';
        });
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!fileInput.files.length) {
                response.textContent = 'Please select a certificate image first.';
                return;
            }
            button.disabled = true;
            response.textContent = 'Extracting certificate details and creating a secure record...';
            progressContainer.hidden = false;
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload_data');
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) progressBar.style.width = `${(event.loaded / event.total) * 100}%`;
            };
            xhr.onload = () => {
                if (xhr.status === 200) {
                    progressBar.style.width = '100%';
                    response.className = 'response success';
                    response.textContent = 'Certificate registered successfully.';
                    transaction.textContent = `Transaction hash: ${xhr.responseText}`;
                } else {
                    response.className = 'response';
                    response.textContent = xhr.responseText || 'Registration failed. Please try again.';
                    button.disabled = false;
                }
            };
            xhr.onerror = () => {
                response.textContent = 'The upload could not be completed. Please try again.';
                button.disabled = false;
            };
            xhr.send(new FormData(form));
        });
    </script>
</body>
</html>
